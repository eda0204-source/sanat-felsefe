<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanatçılar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background-image:  linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('monet.jpg');
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Üst Menü */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            background-image: linear-gradient(rgba(67, 44, 12, 0.7), rgba(104, 95, 95, 0.7)), url('van gogh.jpg');
            background-size: cover;
            background-position: center;
        }
        

        .logo {
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: #d4af37; /* Altın sarısı */
            text-decoration: none;
            text-transform: uppercase;
            font-style: italic; /* İtalik yapıldı */
        }

        .back-btn {
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
            font-style: italic; /* İtalik yapıldı */
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: #d4af37;
        }

        /* Sayfayı Dikey ve Yatay Olarak Tam Ortalayan Alan */
        .wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* 4 Fotoğrafın Yan Yana Dizilimi */
        .gallery {
            display: flex;
            justify-content: center;
            gap: 35px;
            flex-wrap: wrap;
        }

        /* Her Bir Sanatçı Bloğu */
        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 210px;
        }

        /* Fotoğraf ve Altın Çerçevesi */
        .item img {
            width: 210px;
            height: 290px;
            object-fit: cover;
            border: 5px solid #d4af37; /* Altın Sarısı Çerçeve */
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            margin-bottom: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .item img:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
        }

        
        .philosophia-btn {
            width: 100%;
            padding: 10px 0;
            background: transparent;
            color: #d4af37; /* Altın sarısı yazı */
            border: 1.5px solid #d4af37; /* Altın sarısı kenarlık */
            text-align: center;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
            font-style: italic; /* İtalik eklendi */
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .philosophia-btn:hover {
            background: #d4af37;
            color: #000000;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }
        </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">SANAT & FELSEFE</a>
        <a href="index.html" class="back-btn">← Ana Sayfaya Dön</a>
    </header>

    <div class="wrapper">
        <div class="gallery">
            <div class="item">
                <a href="nietzsche.html" class="img-link">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Nietzsche187a.jpg?utm_source=tr.wikipedia.org&utm_campaign=imageinfo&utm_content=original" alt=" Friedric Nietzsche">
                </a>
                <a href="nietzsche.html" class="philosophia-btn">FRIEDRIC NIETZSCHE</a>
            </div>

            <div class="item">
                <a href="camus.html" class="img-link">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Albert_Camus%2C_gagnant_de_prix_Nobel%2C_portrait_en_buste%2C_pos%C3%A9_au_bureau%2C_faisant_face_%C3%A0_gauche%2C_cigarette_de_tabagisme.jpg?utm_source=tr.wikipedia.org&utm_campaign=imageinfo&utm_content=original" alt="Albert Camus">
                </a>
                <a href="camus.html" class="philosophia-btn">ALBERT CAMUS</a>
            </div>
            
            <div class="item">
                <a href="arthur.html" class="img-link">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/bc/Arthur_Schopenhauer_by_J_Sch%C3%A4fer%2C_1859b.jpg?utm_source=tr.wikipedia.org&utm_campaign=imageinfo&utm_content=original" alt="Arthur Schopenhauer">
                </a>
                <a href="arthur.html" class="philosophia-btn">ARTHUR SCHOPENHAUR</a>
            </div>

            <div class="item">
                <a href="hegel.html" class="img-link">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/bf/1831_Schlesinger_Philosoph_Georg_Friedrich_Wilhelm_Hegel_anagoria.JPG?utm_source=tr.wikipedia.org&utm_campaign=imageinfo&utm_content=original" alt="Georg Wilhelm Friedrich Hegel">
                </a>
                <a href="hegel.html" class="philosophia-btn">FRIEDRIC HEGEL</a>
            </div>
        </div>
    </div>
</body>
</html>
